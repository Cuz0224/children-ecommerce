services:
  - type: web
    name: children-ecommerce-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build:server
    startCommand: sqlite3 prisma/dev.db < prisma/sqlite-init.sql && npx prisma generate && npx prisma db seed && npx ts-node -r tsconfig-paths/register --transpile-only --project tsconfig.server.json server/dev-host.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SEED_CUSTOMER_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
